name: CD deploy tag

permissions:
  contents: read

on:
  push:
    tags:
      - 'zyra/v*'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  dispatch-tag:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Mint zyra-infra dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ZYRA_WORKFLOW_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.ZYRA_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
          owner: Souza-zxs
          repositories: zyra-infra
          permission-actions: write

      - name: Trigger staging CD
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run staging-ci.yaml --repo Souza-zxs/zyra-infra --ref main -f tag="$REF_NAME"
