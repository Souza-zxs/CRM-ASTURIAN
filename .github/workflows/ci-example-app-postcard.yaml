name: CI Example App Postcard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/zyra-apps/examples/postcard/**
        packages/zyra-sdk/**
        packages/zyra-client-sdk/**
        packages/zyra-shared/**
        packages/zyra-server/**
        !packages/zyra-sdk/package.json
        !packages/zyra-client-sdk/package.json
        !packages/zyra-shared/package.json
        !packages/zyra-server/package.json

  example-app-postcard:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
    env:
      ZYRA_API_URL: http://localhost:3000
      ZYRA_API_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..HMGqCsVlOAPVUBhKSGlD1X86VoHKt4LIUtET3CGIdik
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build SDK packages
        run: npx nx build zyra-sdk

      - name: Setup server environment
        run: npx nx reset:env:e2e-testing-server zyra-server

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "default";'
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "test";'

      - name: Setup database
        run: npx nx run zyra-server:database:reset

      - name: Start server
        run: nohup npx nx start:ci zyra-server &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000/healthz --timeout 120000 --interval 1000

      - name: Run integration tests
        working-directory: packages/zyra-apps/examples/postcard
        run: npx vitest run

      - name: Configure remote for SDK CLI
        run: |
          mkdir -p ~/.zyra
          cat > ~/.zyra/config.json <<EOF
          {
            "version": 1,
            "remotes": {
              "target": {
                "apiUrl": "${ZYRA_API_URL}",
                "apiKey": "${ZYRA_API_KEY}",
                "accessToken": "${ZYRA_API_KEY}"
              }
            },
            "defaultRemote": "target"
          }
          EOF

      - name: Deploy postcard app (registry install path)
        working-directory: packages/zyra-apps/examples/postcard
        run: node ${{ github.workspace }}/packages/zyra-sdk/dist/cli.cjs deploy --remote target

      - name: Install postcard app (registry install path)
        working-directory: packages/zyra-apps/examples/postcard
        run: node ${{ github.workspace }}/packages/zyra-sdk/dist/cli.cjs install --remote target

  ci-example-app-postcard-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, example-app-postcard]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
