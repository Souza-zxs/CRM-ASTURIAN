name: CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  ZYRA_DEPLOY_URL: http://localhost:2020

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# TODO: this workflow depends on reusable actions (deploy-zyra-app,
# install-zyra-app) that are not published anywhere publicly yet. Either
# publish them to a public actions repository you control, or vendor their
# logic directly into this file, then remove `&& false` below to re-enable.
jobs:
  deploy-and-install:
    if: >-
      false &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Deploy
        uses: zyrahq/zyra/.github/actions/deploy-zyra-app@main
        with:
          api-url: ${{ env.ZYRA_DEPLOY_URL }}
          api-key: ${{ secrets.ZYRA_DEPLOY_API_KEY }}

      - name: Install
        uses: zyrahq/zyra/.github/actions/install-zyra-app@main
        with:
          api-url: ${{ env.ZYRA_DEPLOY_URL }}
          api-key: ${{ secrets.ZYRA_DEPLOY_API_KEY }}
